services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-irishealth-community:2026.3.0AI.154.0}
        MYOWN_DEMO_PASSWORD: ${MYOWN_DEMO_PASSWORD:-ChangeMe2026!}
    container_name: myown-portal-iris
    hostname: myown-portal-iris
    restart: unless-stopped
    # docker/start-iris.sh applies the initial password only for a new durable
    # volume. Existing volumes keep their configured accounts during upgrades.
    ports:
      - "${IRIS_SUPERSERVER_PORT:-1973}:1972"
      - "${IRIS_WEB_PORT:-52774}:52773"
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
      MYOWN_AI_API_KEY: ${MYOWN_AI_API_KEY:-}
      MYOWN_AI_PROVIDER: ${MYOWN_AI_PROVIDER:-openai}
      MYOWN_AI_MODEL: ${MYOWN_AI_MODEL:-gpt-4.1-mini}
    volumes:
      - myown-portal-data:/durable
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | grep -q running"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  myown-portal-data:
    name: ${MYOWN_DATA_VOLUME:-myown-portal-data}
