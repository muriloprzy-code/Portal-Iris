services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-irishealth-community:2026.3.0AI.154.0}
        MYOWN_DEMO_PASSWORD: ${MYOWN_DEMO_PASSWORD:-ChangeMe2026!}
    container_name: myown-portal-iris
    hostname: myown-portal-iris
    restart: unless-stopped
    # docker/start-iris.sh applies the initial password only for a new durable
    # volume. Existing volumes keep their configured accounts during upgrades.
    # Published on this computer only (127.0.0.1). Whoever exposes the portal (for example the
    # hosted demo behind a proxy) sets IRIS_BIND_ADDRESS on purpose, after changing the passwords.
    ports:
      - "${IRIS_BIND_ADDRESS:-127.0.0.1}:${IRIS_SUPERSERVER_PORT:-1973}:1972"
      - "${IRIS_BIND_ADDRESS:-127.0.0.1}:${IRIS_WEB_PORT:-52774}:52773"
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
      MYOWN_AI_API_KEY: ${MYOWN_AI_API_KEY:-}
      MYOWN_AI_PROVIDER: ${MYOWN_AI_PROVIDER:-gemini}
      MYOWN_AI_MODEL: ${MYOWN_AI_MODEL:-gemini-3.5-flash-lite}
      MYOWN_AI_MODE: ${MYOWN_AI_MODE:-live}
      MYOWN_AI_TIMEOUT_SECONDS: ${MYOWN_AI_TIMEOUT_SECONDS:-20}
      MYOWN_AI_MAX_OUTPUT_TOKENS: ${MYOWN_AI_MAX_OUTPUT_TOKENS:-400}
      MYOWN_AI_THINKING: ${MYOWN_AI_THINKING:-low}
      # Public demo (off unless MYOWN_DEMO_MODE=1). The demo password exists only in .env.
      MYOWN_DEMO_MODE: ${MYOWN_DEMO_MODE:-0}
      MYOWN_DEMO_USER_PASSWORD: ${MYOWN_DEMO_USER_PASSWORD:-}
      MYOWN_DEMO_RESET_HOURS: ${MYOWN_DEMO_RESET_HOURS:-6}
      MYOWN_DEMO_SIMULATIONS_PER_MINUTE: ${MYOWN_DEMO_SIMULATIONS_PER_MINUTE:-6}
    volumes:
      - myown-portal-data:/durable
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | grep -q running"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  myown-portal-data:
    name: ${MYOWN_DATA_VOLUME:-myown-portal-data}
